# 连接配置
listen_addresses = '*'
max_connections = 50

# 内存分配 (严控在可用内存安全线内)
shared_buffers = 768MB              # 约占内存的 20%
effective_cache_size = 2GB          # 告知优化器 OS 缓存大致容量
work_mem = 32MB                     # 防止多并发时直接撑爆 RAM
maintenance_work_mem = 256MB        # 建索引时的内存

# 并行查询 (匹配 4 vCPU)
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# WAL 与 Checkpoint (平衡磁盘开销与防抖动)
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# 磁盘访问代价模型
random_page_cost = 1.2
effective_io_concurrency = 100

# PostGIS Raster 专属
postgis.enable_outdb_rasters = on
postgis.gdal_enabled_drivers = 'ENABLE_ALL'

# 监控模块 (实验 C 必须)
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
